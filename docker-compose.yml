services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: ./UserApi
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      MongoDbSettings__ConnectionString: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin
      Redis__ConnectionString: redis:6379,abortConnect=false
      JwtSettings__Key: ${JWT_KEY}
    depends_on:
      - mongo
      - redis

  ui:
    build: ./user-ui
    restart: unless-stopped
    depends_on:
      - api
    # ports yok: disariya artik Caddy bakiyor, ui sadece ic agda

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      - ui

volumes:
  mongo-data:
  redis-data:
  caddy-data: