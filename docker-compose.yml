services:
  mongo:
    image: mongo:7
    container_name: userapi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongo-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: userapi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongo-express:
    image: mongo-express:latest
    container_name: userapi-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo

  api:
    build: ./UserApi
    container_name: userapi-api
    restart: unless-stopped
    ports:
      - "5223:8080"
    environment:
      # Container içinden Mongo/Redis'e "localhost" değil servis adıyla ulaşılır
      MongoDbSettings__ConnectionString: mongodb://admin:admin123@mongo:27017/?authSource=admin
      Redis__ConnectionString: redis:6379,abortConnect=false
      ASPNETCORE_ENVIRONMENT: Development
    depends_on:
      - mongo
      - redis

  ui:
    build: ./user-ui
    container_name: userapi-ui
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
  redis-data:
